<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sayohatlar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-screen night scene. The globe is the page; a quiet left column names the
   journey and lists the places, a paper-photo panel slides in from the right (a sheet on phones). */
:root{
  color-scheme:dark;
  --night:#060a1e; --night-2:#0c1434; --glass:rgba(12,19,52,.78);
  --lapis:#2a5fd0; --tile:#49d3d6; --gold:#f3b94d; --gold-deep:#a86a17; --cream:#ffe7ad;
  --paper:#f6efe1; --ink:#221c2e;
  --text:#eef1ff; --mist:rgba(214,223,255,.72); --faint:rgba(190,204,255,.46); --line:rgba(160,182,255,.2);
  --danger:#ff8f7a;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 70% 10%,#101a48 0%,var(--night-2) 38%,var(--night) 100%) var(--night);
  color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tile);outline-offset:2px}
#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.grabbing{cursor:grabbing}#globe.pointing{cursor:pointer}

/* left column */
.side{position:fixed;left:0;top:0;bottom:0;width:min(400px,38vw);padding-block:28px;padding-inline:28px 0;
  display:flex;flex-direction:column;gap:22px;pointer-events:none;z-index:2}
.side>*{pointer-events:auto}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--tile)}
.eyebrow svg{width:18px;height:18px;flex:none}
h1{font-family:var(--display);font-weight:480;font-size:clamp(30px,3.5vw,50px);line-height:1.04;letter-spacing:-.015em;margin:12px 0 12px;text-wrap:balance;
  font-variation-settings:"opsz" 144}
.sub{margin:0;color:var(--mist);max-width:34ch}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--cream)}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.orbit{margin:-12px 0 0;font-size:13px;color:var(--faint)}
.places{min-height:0;display:flex;flex-direction:column;gap:10px;flex:1}
.places h2{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.stamps{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;padding:2px 6px 2px 2px;scrollbar-width:thin}
.stamp{display:flex;flex:none;align-items:center;gap:10px;width:100%;min-height:42px;text-align:left;padding:8px 14px 8px 12px;border-radius:12px;border:1px solid var(--line);
  background:rgba(14,22,60,.62);backdrop-filter:blur(8px);white-space:nowrap;transition:border-color .2s,background .2s,transform .2s}
.stamp .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.stamp i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.stamp small{margin-left:auto;padding-left:8px;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.stamp:hover{border-color:var(--gold)}
.stamp[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2a1a02;font-weight:700}
.stamp[aria-pressed="true"] i{background:#2a1a02;box-shadow:none}.stamp[aria-pressed="true"] small{color:#5a3c08}
.filter{flex:none}
.filter .inp{border-radius:999px;padding:8px 16px}
.empty{color:var(--mist);font-size:14px;max-width:32ch;margin:0}

/* editor bits */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.inp{width:100%;background:rgba(6,10,30,.6);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text)}
textarea.inp{resize:vertical;min-height:64px}
.inp:focus{outline:none;border-color:var(--tile)}
.edit-only{display:none}
body.editing .edit-only{display:flex}
body.editing .view-only{display:none}
.search{position:relative}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:#0e1640;border:1px solid var(--line);border-radius:12px;
  padding:6px;display:flex;flex-direction:column;max-height:260px;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.results button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:10px}
.results button:hover,.results button:focus-visible{background:rgba(73,211,214,.16)}
.results small{color:var(--faint)}

/* toolbar */
.bar{position:fixed;top:20px;right:20px;z-index:4;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:min(520px,calc(100% - 40px))}
.btn{border:1px solid var(--line);background:rgba(14,22,60,.7);backdrop-filter:blur(8px);border-radius:999px;padding:8px 16px;font-weight:600;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--tile)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1a02}
.btn.danger{border-color:rgba(255,143,122,.5);color:var(--danger)}
.btn.small{padding:5px 12px;font-size:13px}
.chip{font-size:13px;color:var(--mist);padding:6px 12px;border-radius:999px;background:rgba(14,22,60,.7);border:1px solid var(--line)}
.chip.warn{color:var(--cream);border-color:rgba(243,185,77,.5)}.chip.bad{color:var(--danger);border-color:rgba(255,143,122,.5)}

/* photo panel */
.panel{position:fixed;top:72px;right:20px;bottom:20px;width:min(480px,42vw);z-index:3;display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);transform:translateX(calc(100% + 40px));opacity:0;visibility:hidden;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s .55s}
body.open .panel{transform:none;opacity:1;visibility:visible;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s}
.panel-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);position:relative}
.panel-head::after{content:"";position:absolute;left:24px;right:24px;bottom:3px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.panel-head .eyebrow{color:var(--gold);letter-spacing:.14em}
.panel-head h2{font-family:var(--display);font-weight:480;font-size:clamp(28px,3vw,40px);line-height:1.05;margin:8px 40px 6px 0;text-wrap:balance}
.meta{color:var(--mist);font-size:14px;display:flex;gap:8px 14px;flex-wrap:wrap}
.note{margin:10px 0 0;color:var(--text);font-family:var(--display);font-style:italic;font-size:17px;line-height:1.45}
.close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(6,10,30,.5);font-size:20px;line-height:1}
.close:hover{border-color:var(--tile)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:18px 22px 26px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#2a1a02;background:var(--cream);border-radius:6px;padding:2px 8px}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px;perspective:1100px;padding:8px 4px 10px}
.pola{margin:0;background:var(--paper);padding:9px 9px 0;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset;
  transform:rotate(var(--r,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;
  animation:drop .7s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i,0)*70ms + 250ms);position:relative}
.pola:hover{transform:rotate(0deg) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.045);box-shadow:0 26px 50px rgba(0,0,0,.6);z-index:2}
.shot{all:unset;display:block;cursor:zoom-in;width:100%}
.shot:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.shot img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9d0bf}
.pola figcaption{font-family:var(--hand);color:var(--ink);font-size:21px;line-height:1.1;min-height:46px;padding:8px 4px 10px;text-align:center;overflow-wrap:anywhere}
.pola .cap{width:100%;border:0;border-bottom:1px dashed #b9ad97;background:transparent;font-family:var(--hand);font-size:20px;color:var(--ink);text-align:center;padding:2px}
.pola .cap:focus{outline:none;border-bottom-color:var(--lapis)}
.pola .tools{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.pola .tools button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(10,14,40,.78);color:#fff;font-size:15px;line-height:1}
.pola .tools button:hover{background:var(--lapis)}
.pola .tools .on{background:var(--gold);color:#2a1a02}
@keyframes drop{from{opacity:0;transform:translateY(46px) rotateX(-55deg) rotate(var(--r,0deg))}}
.dropzone{border:1.5px dashed rgba(243,185,77,.6);border-radius:14px;padding:18px;text-align:center;color:var(--cream);cursor:pointer;transition:background .2s;display:block}
.dropzone:hover,.dropzone.over{background:rgba(243,185,77,.12)}
.dropzone small{display:block;color:var(--faint);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form{flex-direction:column;gap:12px}

/* lightbox */
.light{position:fixed;inset:0;z-index:10;background:rgba(4,6,20,.93);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.light figure{margin:0;background:var(--paper);padding:14px 14px 0;border-radius:4px;box-shadow:0 40px 100px rgba(0,0,0,.7);max-width:min(92vw,1100px);display:flex;flex-direction:column}
.light img{display:block;max-width:100%;max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px);object-fit:contain;margin:auto}
.light figcaption{font-family:var(--hand);color:var(--ink);font-size:26px;text-align:center;padding:10px 8px 14px;min-height:56px}
.light .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(14,22,60,.8);font-size:26px;line-height:1}
.light .prev{left:14px}.light .next{right:14px}
.light .x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.light .count{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:20px;color:var(--mist);font-variant-numeric:tabular-nums;letter-spacing:.1em;font-size:13px}

/* floating bits */
.tip{position:fixed;z-index:6;pointer-events:none;background:#0e1640;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:13px;white-space:nowrap;transform:translate(14px,14px)}
.tip small{color:var(--faint);display:block}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;background:#0e1640;border:1px solid var(--line);border-radius:999px;padding:9px 18px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.demo{position:fixed;left:calc(50% + min(200px,19vw));top:20px;transform:translateX(-50%);z-index:2;background:rgba(243,185,77,.14);border:1px solid rgba(243,185,77,.5);color:var(--cream);
  border-radius:14px;padding:8px 16px;font-size:13.5px;max-width:min(430px,calc(100% - 32px));text-align:center;backdrop-filter:blur(8px)}
.hint{position:fixed;left:calc(50% + min(200px,19vw));bottom:22px;transform:translateX(-50%);z-index:1;color:var(--faint);font-size:12.5px;letter-spacing:.06em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
body.touched .hint,body.open .hint{opacity:0}

body.open .demo{display:none}
@media (max-width:1199px){body.open .side{display:none}}
@media (max-width:1100px){.demo{top:auto;bottom:60px}}
@media (max-width:760px){
  .side{width:auto;right:0;padding-block:16px;padding-inline:16px;gap:10px}
  .mast{max-width:calc(100% - 128px)}
  h1{font-size:clamp(24px,7.2vw,32px);margin:8px 0 6px}
  .sub{font-size:13.5px;max-width:none}
  .mast .sub.view-only{display:none}
  .stats{gap:18px}.stat b{font-size:22px}.stat span{font-size:10px}.orbit{display:none}
  .places{position:fixed;left:0;right:0;bottom:0;flex:none;max-height:38%;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));gap:8px;
    background:rgba(8,13,38,.88);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:20px 20px 0 0}
  .places h2,.places .empty,.places .search,.places .filter{margin-inline:16px;flex:none}
  .stamps{padding:2px 16px 4px}
  .results{top:auto;bottom:calc(100% + 6px)}
  .bar{top:14px;right:16px}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:62%;border-radius:22px 22px 0 0;border-bottom:0;transform:translateY(105%)}
  .panel-head{padding:18px 18px 14px}.panel-body{padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px))}
  body.open .side{display:none}
  .hint{display:none}
  .demo{left:50%;bottom:128px;font-size:12.5px}
  .wall{gap:20px 14px}
  .light .nav{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none}
}
@media (min-width:761px) and (max-height:560px){.sub.view-only,.orbit{display:none}h1{font-size:28px}.side{gap:14px;padding-block:18px}}
@media (prefers-reduced-motion:reduce){.pola{animation:none}.panel,.pola{transition:none}}
</style>
</head>
<body>

<canvas id="globe" role="img" aria-label="Aylanadigan globus. Borilgan davlatlar oltin rangda. Davlatlarni pastdagi ro‘yxatdan ham tanlash mumkin."></canvas>

<div class="side">
  <header class="mast">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="14" height="14"/><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/></g><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      Atlas
    </div>
    <h1 id="title" class="view-only">Sayohatlar</h1>
    <p id="sub" class="sub view-only"></p>
    <div class="edit-only form" style="margin-top:12px">
      <div class="field"><label for="f-title">Sarlavha</label><input class="inp" id="f-title" maxlength="80"></div>
      <div class="field"><label for="f-sub">Sarlavha ostidagi matn</label><textarea class="inp" id="f-sub" maxlength="240" rows="2"></textarea></div>
    </div>
  </header>
  <div>
    <div class="stats" id="stats"></div>
  </div>
  <p class="orbit" id="orbit"></p>
  <section class="places" aria-label="Borgan joylari">
    <h2>Borgan joylari</h2>
    <div class="search edit-only" style="flex-direction:column;gap:5px">
      <label class="lbl" for="f-search">Davlat qo‘shish</label>
      <input class="inp" id="f-search" placeholder="Davlat nomini yozing" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="stamps" id="stamps"></div>
    <p class="empty" id="empty" hidden></p>
    <div class="filter view-only" id="filterbox">
      <input class="inp" id="f-filter" type="search" placeholder="Davlat yoki joyni qidiring" aria-label="Borgan joylari ichidan qidirish" autocomplete="off">
    </div>
  </section>
</div>

<div class="bar">
  <span class="chip" id="status" hidden></span>
  <button class="btn small" id="retry" hidden>Qayta urinish</button>
  <button class="btn" id="edit" hidden>Tahrirlash</button>
</div>

<aside class="panel" id="panel" aria-label="Davlat rasmlari">
  <div class="panel-head" id="phead"></div>
  <div class="panel-body" id="pbody"></div>
</aside>

<div class="demo" id="demo" hidden></div>
<div class="hint">Aylantirish uchun torting · yaqinlashtirish uchun g‘ildirakni aylantiring</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="light" id="light" hidden>
  <span class="count" id="lcount"></span>
  <button class="close x" id="lx" aria-label="Yopish">×</button>
  <button class="nav prev" id="lprev" aria-label="Oldingi rasm">‹</button>
  <figure><img id="limg" alt=""><figcaption id="lcap"></figcaption></figure>
  <button class="nav next" id="lnext" aria-label="Keyingi rasm">›</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  for(var l=0;l<3;l++){x.fillStyle='hsl('+(hue+12*l)+',38%,'+(46-l*11)+'%)';x.beginPath();x.moveTo(0,700);
    for(var i=0;i<=560;i+=8)x.lineTo(i,430+l*80+Math.sin(i*.011*(l+1)+k*2+l)*34+Math.sin(i*.031+l*3+k)*12);

}
function addFiles(p,fl){
  var arr=Array.from(fl||[]).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name)});
  if(!arr.length)return;var done=0,bad=0;busy++;
  (function next(){
    if(!arr.length){busy--;renderSide();if(bad)toast(bad+' ta rasm ochilmadi. JPG yoki PNG shaklida qo‘shib ko‘ring.');dirty();return;}
    setStatus('', (done+1)+' / '+(done+arr.length)+' rasm tayyorlanmoqda…');
    var file=arr.shift();
    shrink(file).then(function(r){
      var f='photos/'+p.id.toLowerCase().replace(/\W/g,'')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';
      pending.set(f,r.blob);urls.set(f,URL.createObjectURL(r.blob));p.photos.push({f:f,c:'',w:r.w,h:r.h});done++;
      if(sel===p.id)renderPanel();syncCovers();
    },function(){bad++;done++}).then(next);
  })();
}
function setEditing(on){
  editing=on;document.body.classList.toggle('editing',on);$('#edit').textContent=on?'Tayyor':'Tahrirlash';$('#edit').classList.toggle('gold',on);
  if(on){showDemo=false;if(sel&&!isVisited(sel)){closePanel();}$('#f-title').value=data.title||DEF_TITLE;$('#f-sub').value=data.subtitle||DEF_SUB;}
  else{showDemo=data.places.length===0&&!!demoPlaces;if(sel&&!isVisited(sel))closePanel();if(pending.size||removed.size)save();}
  renderSide();renderPanel();measure();
}
$('#edit').onclick=function(){setEditing(!editing)};
$('#f-title').addEventListener('input',function(e){data.title=e.target.value.trim()===DEF_TITLE?'':e.target.value;$('#title').textContent=data.title||DEF_TITLE;dirty()});
$('#f-sub').addEventListener('input',function(e){data.subtitle=e.target.value.trim()===DEF_SUB?'':e.target.value;$('#sub').textContent=data.subtitle||DEF_SUB;dirty()});
var allPlaces=null;
$('#f-search').addEventListener('input',function(e){
  var q=norm(e.target.value),box=$('#results');box.textContent='';
  if(!q){box.hidden=true;return;}
  if(!allPlaces)allPlaces=Object.keys(INDEX).map(function(k){return INDEX[k]}).sort(function(a,b){return a.name.localeCompare(b.name)});
  var m=allPlaces.filter(function(i){return norm(i.name).indexOf(q)>=0||norm(i.en).indexOf(q)>=0||i.id.toLowerCase()===q}).slice(0,8);
  m.forEach(function(i){box.append(h('button',{type:'button',onclick:function(){box.hidden=true;e.target.value='';select(i.id)}},i.name,h('small',{text:isVisited(i.id)?'ro‘yxatda':''})))});
  if(!m.length)box.append(h('button',{type:'button',disabled:true,text:'Topilmadi'}));
  box.hidden=false;
});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))$('#results').hidden=true});

/* ---------- boot ---------- */
function startWorld(){
  if(!window.d3)return false;
  var topo=window.Datamap&&window.Datamap.prototype&&window.Datamap.prototype.worldTopo;
  proj=d3.geoOrthographic().clipAngle(90).precision(.5);path=d3.geoPath(proj,ctx);graticule=d3.geoGraticule().step([15,15])();
  if(topo&&topo.arcs){try{decodeWorld(topo)}catch(e){feats=[];}}
  return feats.length>0;
}
function begin(){
  buildDemo();showDemo=data.places.length===0&&!editing;
  renderSide();if(sel)renderPanel();
}
function loadScript(src){return new Promise(function(ok){var s=document.createElement('script');s.src=src;s.onload=function(){ok(true)};s.onerror=function(){ok(false)};document.head.append(s);});}
resize();window.addEventListener('resize',resize);
var T0=targets();view.cx=T0.cx;view.cy=T0.cy;view.R=T0.R;
requestAnimationFrame(function(t){last=t;frame(t)});
var worldReady=Promise.resolve(startWorld()).then(function(ok){
  if(ok||!window.d3)return ok;
  return loadScript('https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js').then(startWorld);
});
var dataReady=fetch('trips.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(j&&Array.isArray(j.places)){data.title=j.title||'';data.subtitle=j.subtitle||'';if(j.home&&isFinite(j.home.lat)&&isFinite(j.home.lon))data.home=j.home;
    data.places=j.places.filter(function(p){return p&&p.id}).map(function(p){return {id:String(p.id),year:p.year||'',note:p.note||'',photos:(p.photos||[]).filter(function(x){return x&&x.f}).map(function(x){stored.add(x.f);return {f:x.f,c:x.c||'',w:x.w,h:x.h}})}});}
}).catch(function(){});
Promise.all([worldReady,dataReady]).then(function(r){
  if(!r[0])toast(window.d3?'Xarita yuklanmadi. Sahifani yangilab ko‘ring.':'Globus yuklanmadi. Internetni tekshirib, sahifani yangilang.');
  if(window.d3)begin();else{$('#sub').textContent=DEF_SUB;}
});
$('#sub').textContent=DEF_SUB;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){});
var use=window.claude&&window.claude.use;
if(use)Promise.resolve(window.claude.use('artifact')).then(function(a){
  if(!a||typeof a.publish!=='function')return;api=a;$('#edit').hidden=false;if(showDemo)renderSide();
}).catch(function(){});
})();
</script>
