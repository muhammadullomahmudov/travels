<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Sayohatlar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: one full-screen night scene. The globe is the page; a quiet left column names the
   journey and lists the places, a paper-photo panel slides in from the right (a sheet on phones). */
:root{
  color-scheme:dark;
  --night:#060a1e; --night-2:#0c1434; --glass:rgba(12,19,52,.78);
  --lapis:#2a5fd0; --tile:#49d3d6; --gold:#f3b94d; --gold-deep:#a86a17; --cream:#ffe7ad;
  --paper:#f6efe1; --ink:#221c2e;
  --text:#eef1ff; --mist:rgba(214,223,255,.72); --faint:rgba(190,204,255,.46); --line:rgba(160,182,255,.2);
  --danger:#ff8f7a;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 70% 10%,#101a48 0%,var(--night-2) 38%,var(--night) 100%) var(--night);
  color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--tile);outline-offset:2px}
#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#globe.grabbing{cursor:grabbing}#globe.pointing{cursor:pointer}

/* left column */
.side{position:fixed;left:0;top:0;bottom:0;width:min(400px,38vw);padding-block:28px;padding-inline:28px 0;
  display:flex;flex-direction:column;gap:22px;pointer-events:none;z-index:2}
.side>*{pointer-events:auto}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--tile)}
.eyebrow svg{width:18px;height:18px;flex:none}
h1{font-family:var(--display);font-weight:480;font-size:clamp(30px,3.5vw,50px);line-height:1.04;letter-spacing:-.015em;margin:12px 0 12px;text-wrap:balance;
  font-variation-settings:"opsz" 144}
.sub{margin:0;color:var(--mist);max-width:34ch}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-weight:500;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--cream)}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.orbit{margin:-12px 0 0;font-size:13px;color:var(--faint)}
.places{min-height:0;display:flex;flex-direction:column;gap:10px;flex:1}
.places h2{margin:0;font-size:11.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.stamps{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:2px}
.stamp{display:inline-flex;flex:none;align-items:center;gap:8px;max-width:100%;min-height:38px;padding:7px 13px 7px 11px;border-radius:999px;border:1px solid var(--line);
  background:rgba(14,22,60,.62);backdrop-filter:blur(8px);white-space:nowrap;transition:border-color .2s,background .2s,transform .2s}
.stamp .nm{min-width:0;overflow:hidden;text-overflow:ellipsis}
.stamp i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.stamp small{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.stamp:hover{border-color:var(--gold)}
.stamp[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2a1a02;font-weight:700}
.stamp[aria-pressed="true"] i{background:#2a1a02;box-shadow:none}.stamp[aria-pressed="true"] small{color:#5a3c08}
.filter{flex:none}
.filter .inp{border-radius:999px;padding:8px 16px}
.empty{color:var(--mist);font-size:14px;max-width:32ch;margin:0}

/* editor bits */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.inp{width:100%;background:rgba(6,10,30,.6);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text)}
textarea.inp{resize:vertical;min-height:64px}
.inp:focus{outline:none;border-color:var(--tile)}
.edit-only{display:none}
body.editing .edit-only{display:flex}
body.editing .view-only{display:none}
.search{position:relative}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;background:#0e1640;border:1px solid var(--line);border-radius:12px;
  padding:6px;display:flex;flex-direction:column;max-height:260px;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.results button{all:unset;cursor:pointer;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;gap:10px}
.results button:hover,.results button:focus-visible{background:rgba(73,211,214,.16)}
.results small{color:var(--faint)}

/* toolbar */
.bar{position:fixed;top:20px;right:20px;z-index:4;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:min(520px,calc(100% - 40px))}
.btn{border:1px solid var(--line);background:rgba(14,22,60,.7);backdrop-filter:blur(8px);border-radius:999px;padding:8px 16px;font-weight:600;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--tile)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1a02}
.btn.danger{border-color:rgba(255,143,122,.5);color:var(--danger)}
.btn.small{padding:5px 12px;font-size:13px}
.chip{font-size:13px;color:var(--mist);padding:6px 12px;border-radius:999px;background:rgba(14,22,60,.7);border:1px solid var(--line)}
.chip.warn{color:var(--cream);border-color:rgba(243,185,77,.5)}.chip.bad{color:var(--danger);border-color:rgba(255,143,122,.5)}

/* photo panel */
.panel{position:fixed;top:72px;right:20px;bottom:20px;width:min(480px,42vw);z-index:3;display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);transform:translateX(calc(100% + 40px));opacity:0;visibility:hidden;
  transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s .55s}
body.open .panel{transform:none;opacity:1;visibility:visible;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s}
.panel-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);position:relative}
.panel-head::after{content:"";position:absolute;left:24px;right:24px;bottom:3px;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.panel-head .eyebrow{color:var(--gold);letter-spacing:.14em}
.panel-head h2{font-family:var(--display);font-weight:480;font-size:clamp(28px,3vw,40px);line-height:1.05;margin:8px 40px 6px 0;text-wrap:balance}
.meta{color:var(--mist);font-size:14px;display:flex;gap:8px 14px;flex-wrap:wrap}
.note{margin:10px 0 0;color:var(--text);font-family:var(--display);font-style:italic;font-size:17px;line-height:1.45}
.close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(6,10,30,.5);font-size:20px;line-height:1}
.close:hover{border-color:var(--tile)}
.panel-body{flex:1;min-height:0;overflow:auto;padding:18px 22px 26px;display:flex;flex-direction:column;gap:16px;scrollbar-width:thin}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#2a1a02;background:var(--cream);border-radius:6px;padding:2px 8px}
.wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px;perspective:1100px;padding:8px 4px 10px}
.pola{margin:0;background:var(--paper);padding:9px 9px 0;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.6) inset;
  transform:rotate(var(--r,0deg)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s;
  animation:drop .7s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i,0)*70ms + 250ms);position:relative}
.pola:hover{transform:rotate(0deg) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-6px) scale(1.045);box-shadow:0 26px 50px rgba(0,0,0,.6);z-index:2}
.shot{all:unset;display:block;cursor:zoom-in;width:100%}
.shot:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}
.shot img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#d9d0bf}
.pola figcaption{font-family:var(--hand);color:var(--ink);font-size:21px;line-height:1.1;min-height:46px;padding:8px 4px 10px;text-align:center;overflow-wrap:anywhere}
.pola .cap{width:100%;border:0;border-bottom:1px dashed #b9ad97;background:transparent;font-family:var(--hand);font-size:20px;color:var(--ink);text-align:center;padding:2px}
.pola .cap:focus{outline:none;border-bottom-color:var(--lapis)}
.pola .tools{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.pola .tools button{width:30px;height:30px;border-radius:50%;border:0;background:rgba(10,14,40,.78);color:#fff;font-size:15px;line-height:1}
.pola .tools button:hover{background:var(--lapis)}
.pola .tools .on{background:var(--gold);color:#2a1a02}
@keyframes drop{from{opacity:0;transform:translateY(46px) rotateX(-55deg) rotate(var(--r,0deg))}}
.dropzone{border:1.5px dashed rgba(243,185,77,.6);border-radius:14px;padding:18px;text-align:center;color:var(--cream);cursor:pointer;transition:background .2s;display:block}
.dropzone:hover,.dropzone.over{background:rgba(243,185,77,.12)}
.dropzone small{display:block;color:var(--faint);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.form{flex-direction:column;gap:12px}

/* lightbox */
.light{position:fixed;inset:0;z-index:10;background:rgba(4,6,20,.93);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.light figure{margin:0;background:var(--paper);padding:14px 14px 0;border-radius:4px;box-shadow:0 40px 100px rgba(0,0,0,.7);max-width:min(92vw,1100px);display:flex;flex-direction:column}
.light img{display:block;max-width:100%;max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px);object-fit:contain;margin:auto}
.light figcaption{font-family:var(--hand);color:var(--ink);font-size:26px;text-align:center;padding:10px 8px 14px;min-height:56px}
.light .nav{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(14,22,60,.8);font-size:26px;line-height:1}
.light .prev{left:14px}.light .next{right:14px}
.light .x{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.light .count{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:20px;color:var(--mist);font-variant-numeric:tabular-nums;letter-spacing:.1em;font-size:13px}

/* floating bits */
.tip{position:fixed;z-index:6;pointer-events:none;background:#0e1640;border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:13px;white-space:nowrap;transform:translate(14px,14px)}
.tip small{color:var(--faint);display:block}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;background:#0e1640;border:1px solid var(--line);border-radius:999px;padding:9px 18px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.demo{position:fixed;left:calc(50% + min(200px,19vw));top:20px;transform:translateX(-50%);z-index:2;background:rgba(243,185,77,.14);border:1px solid rgba(243,185,77,.5);color:var(--cream);
  border-radius:14px;padding:8px 16px;font-size:13.5px;max-width:min(430px,calc(100% - 32px));text-align:center;backdrop-filter:blur(8px)}
.hint{position:fixed;left:calc(50% + min(200px,19vw));bottom:22px;transform:translateX(-50%);z-index:1;color:var(--faint);font-size:12.5px;letter-spacing:.06em;pointer-events:none;transition:opacity .6s;white-space:nowrap}
body.touched .hint,body.open .hint{opacity:0}

body.open .demo{display:none}
@media (max-width:1199px){body.open .side{display:none}}
@media (max-width:1100px){.demo{top:auto;bottom:60px}}
@media (max-width:760px){
  .side{width:auto;right:0;padding-block:16px;padding-inline:16px;gap:10px}
  .mast{max-width:calc(100% - 128px)}
  h1{font-size:clamp(24px,7.2vw,32px);margin:8px 0 6px}
  .sub{font-size:13.5px;max-width:none}
  .mast .sub.view-only{display:none}
  .stats{gap:18px}.stat b{font-size:22px}.stat span{font-size:10px}.orbit{display:none}
  .places{position:fixed;left:0;right:0;bottom:0;flex:none;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));gap:8px;
    background:rgba(8,13,38,.88);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:20px 20px 0 0}
  .places h2,.places .empty,.places .search,.places .filter{margin-inline:16px;flex:none}
  .stamps{padding:2px 16px 4px;gap:7px}
  .stamp{min-height:36px;padding:6px 12px 6px 10px;font-size:14px}
  .results{top:auto;bottom:calc(100% + 6px)}
  .bar{top:14px;right:16px}
  .panel{top:auto;left:0;right:0;bottom:0;width:auto;height:62%;border-radius:22px 22px 0 0;border-bottom:0;transform:translateY(105%)}
  .panel-head{padding:18px 18px 14px}.panel-body{padding:14px 16px calc(22px + env(safe-area-inset-bottom,0px))}
  body.open .side{display:none}
  .hint{display:none}
  .demo{left:50%;bottom:128px;font-size:12.5px}
  .wall{gap:20px 14px}
  .light .nav{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none}
}
@media (min-width:761px) and (max-height:560px){.sub.view-only,.orbit{display:none}h1{font-size:28px}.side{gap:14px;padding-block:18px}}
@media (prefers-reduced-motion:reduce){.pola{animation:none}.panel,.pola{transition:none}}

/* ---------- real map (Leaflet) ---------- */
#globe{z-index:0;background:#0a1a44;font-family:var(--body)}
#globe::after{content:"";position:absolute;inset:0;z-index:460;pointer-events:none;background:linear-gradient(90deg,rgba(6,10,30,.78) 0,rgba(6,10,30,.45) min(330px,30vw),rgba(6,10,30,0) min(520px,44vw)),linear-gradient(180deg,rgba(6,10,30,.35),rgba(6,10,30,0) 120px)}
@media (max-width:760px){#globe::after{background:linear-gradient(180deg,rgba(6,10,30,.82) 0,rgba(6,10,30,.5) 150px,rgba(6,10,30,0) 230px)}.pin .pi{transform:scale(.82)}.pin.on .pi{transform:scale(1.05)}}
#globe.leaflet-container{cursor:grab}#globe.leaflet-dragging{cursor:grabbing}
.leaflet-tile-container img.leaflet-tile{width:256.6px!important;height:256.6px!important}
.cl{background:none;border:0}
.cl span{display:block;transform:translate(-50%,-50%);white-space:nowrap;font:600 11px/1 var(--body);letter-spacing:.03em;color:rgba(255,255,255,.92);
  text-shadow:0 0 3px rgba(0,0,0,.95),0 1px 2px rgba(0,0,0,.9);pointer-events:none}
.cl.v span{color:#ffe7ad;font-weight:700;font-size:12px}
body.street .cl span{color:#4a4458;text-shadow:0 0 3px #fff,0 0 2px #fff,0 0 1px #fff}
body.street .cl.v span{color:#8a4f00}
.pin{background:none;border:0}
.pin .pi{position:absolute;inset:0;transform-origin:22px 49px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.pin .pi::after{content:"";position:absolute;left:14px;top:46px;width:16px;height:6px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px)}
.pin .ph{position:absolute;left:2px;top:0;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);overflow:hidden;
  border:2.5px solid #ffe7ad;background:#f3b94d;box-shadow:0 6px 14px rgba(0,0,0,.5);z-index:1}
.pin .ph img{display:block;width:142%;height:142%;margin:-21% 0 0 -21%;object-fit:cover;transform:rotate(45deg)}
.pin b{position:absolute;right:-6px;top:-6px;z-index:2;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#f3b94d;color:#2a1a02;
  font:700 11px/20px var(--body);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pin:hover .pi{transform:scale(1.12)}
.pin.on .pi{transform:scale(1.28)}.pin.on .ph{border-color:#fff;box-shadow:0 0 0 4px rgba(243,185,77,.5),0 8px 20px rgba(0,0,0,.6)}
.home{background:none;border:0}
.home i{display:block;width:14px;height:14px;border-radius:50%;background:#8ff3f5;border:2px solid #fff;animation:ping 2.4s ease-out infinite}
.home span{position:absolute;left:19px;top:-2px;font:600 12px/1 var(--body);color:#bdf6f7;white-space:nowrap;text-shadow:0 0 3px #000,0 1px 2px #000}
body.street .home span{color:#0b6c74;text-shadow:0 0 3px #fff,0 0 2px #fff}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(143,243,245,.75)}100%{box-shadow:0 0 0 16px rgba(143,243,245,0)}}
.arc{stroke-dasharray:5 7;stroke-linecap:round}
.arc-sel{stroke-dasharray:12 8;animation:flow 1.1s linear infinite;filter:drop-shadow(0 0 4px rgba(255,220,140,.9))}
@keyframes flow{to{stroke-dashoffset:-20}}
.plane{background:none;border:0}.plane svg{display:block;filter:drop-shadow(0 0 5px rgba(255,220,140,.95))}
.layer-switch{display:block;width:74px;height:74px;padding:0;border-radius:12px;border:2px solid #fff;background:#123 center/cover no-repeat;position:relative;overflow:hidden;
  cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.5);transition:transform .2s}
.layer-switch:hover{transform:scale(1.05)}
.layer-switch.sat{background-image:url(https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/2/1/2)}
.layer-switch.map{background-image:url(https://a.basemaps.cartocdn.com/rastertiles/voyager_nolabels/2/2/1.png)}
.layer-switch span{position:absolute;left:0;right:0;bottom:0;padding:12px 2px 4px;font:600 11px/1.1 var(--body);color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.8))}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:12px!important;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45)!important}
.leaflet-bar a,.leaflet-bar a:hover{width:36px!important;height:36px!important;line-height:36px!important;background:rgba(14,22,60,.88);color:var(--text);border-bottom-color:var(--line)!important}
.leaflet-bar a:hover{background:rgba(42,95,208,.9)}
.leaflet-control-attribution{background:rgba(6,10,30,.55)!important;color:rgba(214,223,255,.6)!important;font-size:10px!important;border-radius:8px 0 0 0}
.leaflet-control-attribution a{color:rgba(214,223,255,.8)!important}
.leaflet-right .leaflet-control{margin-right:20px}.leaflet-bottom .leaflet-control{margin-bottom:12px}
body.open .leaflet-right{right:min(500px,calc(42vw + 20px))}
.gh-modal{position:fixed;inset:0;z-index:20;background:rgba(4,6,20,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.gh-card{width:min(460px,100%);background:#0e1640;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.gh-card h3{margin:0;font-family:var(--display);font-weight:500;font-size:28px}
.gh-card p,.gh-card ol{margin:0;color:var(--mist);font-size:14px}.gh-card ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.gh-msg{color:var(--cream)!important;min-height:1.2em}
@media (max-width:760px){
  .leaflet-bottom.leaflet-right{bottom:auto;top:62px}
  .leaflet-bottom .leaflet-control{margin-bottom:0;margin-top:10px}.leaflet-right .leaflet-control{margin-right:12px}
  .layer-switch{width:56px;height:56px}
  .leaflet-control-attribution{display:none}
  body.open .leaflet-right{right:0}body.open .leaflet-bottom.leaflet-right{display:none}
}

/* ---------- compact place list + quick add ---------- */
.places{flex:none;gap:8px;min-height:0}
.places-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.add-c{flex:none;border:1px solid rgba(243,185,77,.55);background:rgba(243,185,77,.12);color:var(--cream);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .2s}

<body>

<div id="globe" role="region" aria-label="Dunyo xaritasi. Borilgan davlatlar oltin rangda. Davlatlarni pastdagi ro‘yxatdan ham tanlash mumkin."></div>

<div class="side">
  <header class="mast">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="14" height="14"/><rect x="5" y="5" width="14" height="14" transform="rotate(45 12 12)"/></g><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      Atlas

      <div class="field"><label for="f-sub">Sarlavha ostidagi matn</label><textarea class="inp" id="f-sub" maxlength="240" rows="2"></textarea></div>

  <div>

  <section class="places" aria-label="Borgan joylari">
    <div class="places-head"><h2>Borgan joylari</h2><button class="add-c" id="addc" type="button" aria-expanded="false">+ Davlat qo‘shish</button></div>
    <div class="search addbox" id="addbox" hidden>
      <input class="inp" id="f-search" placeholder="Yangi davlat nomini yozing" aria-label="Yangi davlat nomi" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="filter view-only" id="filterbox">
      <input class="inp" id="f-filter" type="search" placeholder="Davlat yoki joyni qidiring" aria-label="Borgan joylari ichidan qidirish" autocomplete="off">
    </div>

  </section>
</div>

<div class="bar">
  <span class="chip" id="status" hidden></span>
  <button class="btn small" id="retry" hidden>Qayta urinish</button>
</div>

<aside class="panel" id="panel" aria-label="Davlat rasmlari">
  <div class="panel-head" id="phead"></div>
  <div class="panel-body" id="pbody"></div>
</aside>

<div class="demo" id="demo" hidden></div>
<div class="hint">Surish uchun torting · yaqinlashtirish uchun g‘ildirakni aylantiring</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="light" id="light" hidden>
  <span class="count" id="lcount"></span>
  <button class="close x" id="lx" aria-label="Yopish">×</button>
  <button class="nav prev" id="lprev" aria-label="Oldingi rasm">‹</button>
  <figure><img id="limg" alt=""><figcaption id="lcap"></figcaption></figure>
  <button class="nav next" id="lnext" aria-label="Keyingi rasm">›</button>

var UZ_EN={'Northern Cyprus':'Shimoliy Kipr','Kosovo':'Kosovo','Somaliland':'Somalilend'};
var SHORT={ARE:'BAA',ZAF:'JAR',COD:'Kongo DR',CAF:'Markaziy Afrika',BIH:'Bosniya',DOM:'Dominikana',ATF:'Fr. Janubiy hududlari'};
/* places too small for the map outline: shown as a pin only */
var SMALL=[['SGP','Singapur',1.35,103.82],['MDV','Maldiv orollari',3.2,73.22],['BHR','Bahrayn',26.07,50.55],['MLT','Malta',35.9,14.45],['MCO','Monako',43.74,7.42],['VAT','Vatikan',41.9,12.45],['SMR','San-Marino',43.94,12.46],['AND','Andorra',42.55,1.6],['LIE','Lixtenshteyn',47.16,9.55],['HKG','Gonkong',22.32,114.17],['MAC','Makao',22.2,113.55],['MUS','Mavrikiy',-20.3,57.55],['SYC','Seyshel orollari',-4.68,55.49],['CPV','Kabo-Verde',15.1,-23.6],['COM','Komor orollari',-11.7,43.3],['BRB','Barbados',13.19,-59.54],['WSM','Samoa',-13.76,-172.1],['TON','Tonga',-21.18,-175.2]];
/* nicer pin spots for wide countries: [lon,lat] */
var SPOT={RUS:[37.6,55.75],USA:[-98,39],CAN:[-106,56],FRA:[2.5,46.6],CHN:[104,35],IDN:[113.5,-1],MYS:[102.2,4.2],NOR:[9.5,61],CHL:[-71,-33],NZL:[172.5,-42.5],JPN:[138.5,36.2],GBR:[-1.5,52.8],ITA:[12.5,42.8],GRC:[22.5,39.3],DNK:[9.5,56],PHL:[122,13]};

/* ---------- state ---------- */
var feats=[], INDEX={}, land=null, graticule=null;
var data={v:1,title:'',subtitle:'',home:{name:'Toshkent',lat:41.31,lon:69.28},places:[]};
var demoPlaces=null, showDemo=false, editing=false, sel=null, hoverId=null;
var api=null, readOnly=false;
var rt={};              /* per-place runtime: lift, cover image */
var urls=new Map();     /* photo path -> object URL for photos not saved yet */
var pending=new Map(), removed=new Set(), stored=new Set();
var saving=false, again=false, saveTimer=0, busy=0;

function norm(s){return String(s).toLowerCase().replace(/[‘’'ʻʼ`\-\s]/g,'')}
function nf(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function h(tag,props){
  var e=document.createElement(tag),k,v;
  for(k in (props||{})){v=props[k]; if(v==null||v===false)continue;
    if(k==='class')e.className=v; else if(k==='text')e.textContent=v; else if(k==='style')e.style.cssText=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='for'||k.indexOf('-')>0||k==='role')e.setAttribute(k,v); else e[k]=v;}
  for(var i=2;i<arguments.length;i++){var c=arguments[i]; if(c==null||c===false)continue;
    if(Array.isArray(c))c.forEach(function(x){if(x)e.append(x)}); else e.append(c);}
  return e;
}
function list(){return showDemo?demoPlaces:data.places}
function info(id){return INDEX[id]||null}
function nameOf(id){var i=info(id);return i?i.name:(UZ[id]||id)}
function srcFor(ph){return ph.u||urls.get(ph.f)||ph.f}
function homeLL(){return [data.home.lon,data.home.lat]}
function kmTo(i){return d3.geoDistance(homeLL(),i.c)*6371}

/* ---------- world ---------- */
function decodeWorld(topo){
  var tf=topo.transform;
  var arcs=topo.arcs.map(function(a){var x=0,y=0;return a.map(function(p){
    if(tf){x+=p[0];y+=p[1];return [x*tf.scale[0]+tf.translate[0],y*tf.scale[1]+tf.translate[1]];}
    return [p[0],p[1]];});});
  function ring(ids){var out=[];ids.forEach(function(i){var a=arcs[i<0?~i:i]; if(i<0)a=a.slice().reverse();
    for(var k=out.length?1:0;k<a.length;k++)out.push(a[k]);});return out;}
  function poly(rs){var p=rs.map(ring);
    if(d3.geoArea({type:'Polygon',coordinates:p})>TAU)p.forEach(function(r){r.reverse()});
    return p;}
  var obj=topo.objects.world||topo.objects[Object.keys(topo.objects)[0]], seen={};
  obj.geometries.forEach(function(g){
    if(!g.arcs||!g.arcs.length)return;
    var coords=g.type==='Polygon'?[poly(g.arcs)]:g.arcs.map(poly);
    var en=(g.properties&&g.properties.name)||String(g.id);
    var id=(g.id&&g.id!=='-99'&&g.id!==-99)?String(g.id):'X_'+en.replace(/\W/g,'');
    if(seen[id])return; seen[id]=1;
    var best=null,ba=-1;
    coords.forEach(function(p){var a=d3.geoArea({type:'Polygon',coordinates:p}); if(a>ba){ba=a;best=p;}});
    var geo={type:'MultiPolygon',coordinates:coords};
    var f={id:id,en:en,name:UZ[id]||UZ_EN[en]||en,geo:geo,bounds:d3.geoBounds(geo),
      c:SPOT[id]||d3.geoCentroid({type:'Polygon',coordinates:best})};
    feats.push(f); INDEX[id]=f;
  });
}
SMALL.forEach(function(s){INDEX[s[0]]={id:s[0],name:s[1],en:s[1],c:[s[3],s[2]],geo:null};});
function pick(ll){
  for(var i=0;i<feats.length;i++){var f=feats[i],b=f.bounds,lo=ll[0],la=ll[1];
    if(la<b[0][1]||la>b[1][1])continue;
    if(b[0][0]<=b[1][0]?(lo<b[0][0]||lo>b[1][0]):(lo<b[0][0]&&lo>b[1][0]))continue;
    if(d3.geoContains(f.geo,ll))return f;}
  return null;
}

/* ---------- demo postcards ---------- */
function postcard(hue,k,label){
  var c=document.createElement('canvas');c.width=560;c.height=700;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,700);g.addColorStop(0,'hsl('+hue+',70%,'+(58+k*6)+'%)');g.addColorStop(.6,'hsl('+(hue+38)+',85%,84%)');g.addColorStop(1,'hsl('+(hue+50)+',80%,90%)');
  x.fillStyle=g;x.fillRect(0,0,560,700);
  x.fillStyle='rgba(255,250,225,.92)';x.beginPath();x.arc(150+k*130,190+k*40,54,0,TAU);x.fill();
  for(var l=0;l<3;l++){x.fillStyle='hsl('+(hue+12*l)+',38%,'+(46-l*11)+'%)';x.beginPath();x.moveTo(0,700);
    for(var i=0;i<=560;i+=8)x.lineTo(i,430+l*80+Math.sin(i*.011*(l+1)+k*2+l)*34+Math.sin(i*.031+l*3+k)*12);
    x.lineTo(560,700);x.fill();}
  x.fillStyle='rgba(255,255,255,.5)';x.font='700 30px sans-serif';x.textAlign='center';x.fillText('NAMUNA',280,80);
  x.fillStyle='rgba(255,255,255,.92)';x.font='600 34px Georgia,serif';x.fillText(label,280,650);
  return c.toDataURL('image/jpeg',.82);
}
function buildDemo(){
  var d=[['SAU','2018',28],['TUR','2015',350],['ARE','2019',200],['RUS','2012',225],['MYS','2022',150]];
  demoPlaces=d.filter(function(r){return INDEX[r[0]]}).map(function(r){
    var nm=SHORT[r[0]]||nameOf(r[0]),ph=[];
    for(var k=0;k<3;k++)ph.push({f:'demo-'+r[0]+k,u:postcard(r[2],k,nm),c:'Namuna rasm '+(k+1),w:560,h:700});
    return {id:r[0],year:r[1],note:'Namuna: bu yerga safar haqida qisqa xotira yoziladi.',photos:ph,demo:true};
  });
}

/* ---------- real map (Leaflet): satellite or street tiles, our own country borders and names ---------- */
var W=window.innerWidth,H=window.innerHeight,map=null,countryLayer=null,labelLayer=null,arcLayer=null,pinLayer=null,nightLayer=null,homeMarker=null,planeMarker=null;
var layerByIs={},pinById={},labelMarkers=[],baseLayers={},curBase='sat';
var arcRenderer=null,nightRenderer=null;
function measure(){if(map)map.invalidateSize({pan:false});}
function resize(){W=window.innerWidth;H=window.innerHeight;measure();}
function pads(){
  var mobile=W<760,open=!!sel;
  if(mobile){var sheet=open?H*.62:Math.max(140,H-($('.places').getBoundingClientRect().top||H*.7));
    return {tl:[16,open?16:Math.max(90,($('#stats').getBoundingClientRect().bottom||120)+10)],br:[16,sheet+16]};}
  var lw=(open&&W<1200)?20:Math.min(400,W*.38)+10,pw=open?Math.min(480,W*.42)+40:20;
  return {tl:[lw,70],br:[pw,30]};
}
function fitWorld(anim){if(!map)return;var p=pads();map.fitBounds([[-52,-165],[74,175]],{paddingTopLeft:p.tl,paddingBottomRight:p.br,animate:!!anim&&!reduce,duration:1.1});}
function flyWorld(){fitWorld(true);}
function flyTo(c,z){if(!map)return;var p=pads(),i=null;
  for(var k in INDEX)if(INDEX[k].c===c)i=INDEX[k];
  if(i&&i.geo){var b=L.geoJSON(i.geo).getBounds();map.flyToBounds(b,{paddingTopLeft:p.tl,paddingBottomRight:p.br,maxZoom:6,duration:reduce?0:1.3});}
  else map.flyTo([c[1],c[0]],z||5,{duration:reduce?0:1.3});
}
function zoomFor(){return 0}
function styleFor(id){
  var v=isVisited(id),isSel=id===sel,hot=id===hoverId,sat=curBase==='sat';
  if(isSel)return {fillColor:'#ffd678',fillOpacity:.42,color:'#fff6dc',weight:2.6,opacity:1};
  if(v)return {fillColor:'#f3b94d',fillOpacity:hot?.4:.26,color:'#f3b94d',weight:hot?2.4:1.6,opacity:.95};
  return {fillColor:'#ffffff',fillOpacity:hot?.14:0,color:sat?'rgba(255,255,255,.75)':'#8a7f99',weight:hot?1.6:.8,opacity:sat?.55:.7};
}
/* rings that cross the 180° meridian are made continuous so they don't smear across the map */
function unwrap(g){return {type:'MultiPolygon',coordinates:g.coordinates.map(function(poly){return poly.map(function(ring){var out=[],prev=null,off=0;
  ring.forEach(function(p){var x=p[0]+off;if(prev!==null){if(x-prev>180){off-=360;x-=360;}else if(prev-x>180){off+=360;x+=360;}}out.push([x,p[1]]);prev=x;});return out;});})};}
function restyle(){if(!countryLayer)return;countryLayer.eachLayer(function(l){l.setStyle(styleFor(l.feature.id))});}

/* country names: big countries early, small ones as you zoom in, like a real map */
function buildLabels(){
  labelMarkers=feats.map(function(f){
    var a=d3.geoArea(f.geo),minZ=a>.08?2:a>.02?3:a>.004?4:a>.0008?5:6;
    var m=L.marker([f.c[1],f.c[0]],{pane:'labels',interactive:false,keyboard:false,icon:L.divIcon({className:'cl',html:'<span>'+(SHORT[f.id]||f.name)+'</span>',iconSize:null})});
    m._minZ=minZ;m._id=f.id;return m;});
  updateLabels();
}
function updateLabels(){if(!map)return;var z=map.getZoom();
  labelMarkers.forEach(function(m){var show=z>=m._minZ;if(show&&!labelLayer.hasLayer(m))labelLayer.addLayer(m);else if(!show&&labelLayer.hasLayer(m))labelLayer.removeLayer(m);
    var el=m.getElement();if(el)el.classList.toggle('v',isVisited(m._id));});}

/* great-circle arcs from home, as gold flowing lines */
function arcPts(a,b){var it=d3.geoInterpolate(a,b),d=d3.geoDistance(a,b),n=Math.max(16,Math.round(d*40)),out=[];
  for(var i=0;i<=n;i++){var p=it(i/n);out.push([p[1],p[0]]);}return out;}
function drawArcs(){
  if(!arcLayer)return;arcLayer.clearLayers();
  list().forEach(function(p){var i=info(p.id);if(!i)return;var pts=arcPts(homeLL(),i.c),isSel=p.id===sel,dim=sel&&!isSel;
    L.polyline(pts,{renderer:arcRenderer,interactive:false,color:isSel?'#ffe7ad':'#f3b94d',weight:isSel?3:1.6,opacity:dim?.25:.85,className:'arc'+(isSel?' arc-sel':'')}).addTo(arcLayer);});
}
function drawPins(){
  if(!pinLayer)return;pinLayer.clearLayers();pinById={};
  list().forEach(function(p){var i=info(p.id);if(!i)return;var cov=p.photos[0]?srcFor(p.photos[0]):'',isSel=p.id===sel;
    var html='<span class="ph">'+(cov?'<img src="'+cov.replace(/"/g,'&quot;')+'" alt="">':'')+'</span><b>'+p.photos.length+'</b>';
    var m=L.marker([i.c[1],i.c[0]],{icon:L.divIcon({className:'pin'+(isSel?' on':''),html:html,iconSize:[44,44],iconAnchor:[22,22]}),title:nameOf(p.id),riseOnHover:true,zIndexOffset:isSel?1000:0});
    m.on('click',function(){select(p.id)});m.addTo(pinLayer);pinById[p.id]=m;});
}
function drawHome(){if(!map)return;if(homeMarker)map.removeLayer(homeMarker);
  homeMarker=L.marker([data.home.lat,data.home.lon],{interactive:false,keyboard:false,zIndexOffset:-100,icon:L.divIcon({className:'home',html:'<i></i><span>'+data.home.name+'</span>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);}

/* live day/night: the part of the Earth where it is night right now is gently shaded */
function nightPolygon(){
  var d=new Date(),jd=d.getTime()/864e5+2440587.5,n=jd-2451545,Lm=(280.46+.9856474*n)%360,g=(357.528+.9856003*n)%360*RAD;
  var lam=(Lm+1.915*Math.sin(g)+.02*Math.sin(2*g))*RAD,eps=(23.439-4e-7*n)*RAD,dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  var ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),gmst=(18.697374558+24.06570982441908*n)%24;
  var sunLon=((ra*DEG-gmst*15)%360+540)%360-180,pts=[];
  for(var lon=-180;lon<=180;lon+=2){var lat=Math.atan(-Math.cos((lon-sunLon)*RAD)/Math.tan(dec))*DEG;pts.push([Math.max(-85,Math.min(85,lat)),lon]);}
  var pole=dec>0?-85:85;pts.push([pole,180]);pts.push([pole,-180]);return pts;
}
function drawNight(){if(!map)return;if(nightLayer)map.removeLayer(nightLayer);
  nightLayer=L.polygon(nightPolygon(),{pane:'night',interactive:false,stroke:false,fillColor:'#020818',fillOpacity:.32,renderer:nightRenderer}).addTo(map);}

function flyPlane(id){
  if(reduce||!map)return;var i=info(id);if(!i)return;var pts=arcPts(homeLL(),i.c),t0=performance.now(),dur=1900;
  if(planeMarker)map.removeLayer(planeMarker);
  planeMarker=L.marker(pts[0],{interactive:false,keyboard:false,zIndexOffset:2000,icon:L.divIcon({className:'plane',html:'<svg viewBox="-14 -10 26 20" width="26" height="20"><path d="M11 0L-2-2.2-6-9h-2.5L-6-2-10-1.6-12-4.5h-1.5L-12.4 0-13.5 4.5H-12L-10 1.6-6 2-8.5 9H-6L-2 2.2Z" fill="#fff"/></svg>',iconSize:[26,20],iconAnchor:[13,10]})}).addTo(map);
  (function step(now){if(!planeMarker||sel!==id){if(planeMarker){map.removeLayer(planeMarker);planeMarker=null;}return;}
    var t=Math.min(1,(now-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,k=Math.min(pts.length-2,Math.floor(e*(pts.length-1))),a=map.latLngToLayerPoint(pts[k]),b=map.latLngToLayerPoint(pts[k+1]);
    planeMarker.setLatLng(pts[k]);var el=planeMarker.getElement();if(el)el.firstChild.style.transform='rotate('+Math.atan2(b.y-a.y,b.x-a.x)+'rad)';
    if(t<1)requestAnimationFrame(step);else{map.removeLayer(planeMarker);planeMarker=null;}})(t0);
}

function initMap(){

    maxBounds:[[-85,-220],[85,220]],maxBoundsViscosity:.9,preferCanvas:false,fadeAnimation:true,zoomAnimation:!reduce});

  baseLayers.map=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap, © CARTO'});
  baseLayers[curBase].addTo(map);

  map.createPane('labels');map.getPane('labels').style.zIndex=450;map.getPane('labels').style.pointerEvents='none';
  countryLayer=L.geoJSON({type:'FeatureCollection',features:feats.filter(function(f){return f.id!=='ATA'}).map(function(f){return {type:'Feature',id:f.id,properties:{},geometry:unwrap(f.geo)}})},{
    renderer:L.canvas({padding:.3,tolerance:2}),style:function(ft){return styleFor(ft.id)},
    onEachFeature:function(ft,l){
      l.on('mouseover',function(e){hoverId=ft.id;l.setStyle(styleFor(ft.id));showTip(ft.id,e.originalEvent);});

    }}).addTo(map);
  arcLayer=L.layerGroup().addTo(map);

  var sw=L.control({position:'bottomright'});
  sw.onAdd=function(){var b=L.DomUtil.create('button','layer-switch');b.type='button';
    function paint(){var other=curBase==='sat'?'map':'sat';b.className='layer-switch '+other;b.innerHTML='<span>'+(other==='sat'?'Sun’iy yo‘ldosh':'Xarita')+'</span>';b.setAttribute('aria-label',other==='sat'?'Sun’iy yo‘ldosh ko‘rinishi':'Oddiy xarita ko‘rinishi');}
    paint();L.DomEvent.disableClickPropagation(b);
    b.onclick=function(){map.removeLayer(baseLayers[curBase]);curBase=curBase==='sat'?'map':'sat';baseLayers[curBase].addTo(map);document.body.classList.toggle('street',curBase==='map');paint();restyle();};
    return b;};

/* ---------- editing + saving ---------- */
function setStatus(kind,text){var s=$('#status');s.hidden=!text;s.textContent=text||'';s.className='chip'+(kind==='warn'?' warn':kind==='bad'?' bad':'');$('#retry').hidden=kind!=='retry';if(kind==='retry')s.className='chip bad';}
function dirty(){if(!api||readOnly){if(readOnly)setStatus('bad','Bu ko‘rinishda saqlab bo‘lmaydi. O‘zgarishlar faqat shu oynada turadi.');return;}
  setStatus('warn','Saqlanmagan o‘zgarishlar');clearTimeout(saveTimer);saveTimer=setTimeout(save,2600);}
function dropFile(f){if(pending.has(f))pending.delete(f);else if(stored.has(f))removed.add(f);var u=urls.get(f);if(u){URL.revokeObjectURL(u);urls.delete(f);}}
function serialize(skip){return JSON.stringify({v:1,title:data.title||'',subtitle:data.subtitle||'',home:data.home,
  places:data.places.map(function(p){return {id:p.id,year:p.year||'',note:p.note||'',photos:p.photos.filter(function(x){return !skip.has(x.f)}).map(function(x){return {f:x.f,c:x.c||'',w:x.w,h:x.h}})}})});}
function save(){
  clearTimeout(saveTimer);if(!api||readOnly)return;
  if(busy){saveTimer=setTimeout(save,1200);return;}
  if(saving){again=true;return;}
  saving=true;again=false;setStatus('', 'Saqlanmoqda…');
  var batch=Array.from(pending.keys()).slice(0,20),skip=new Set(Array.from(pending.keys()).slice(20)),gone=Array.from(removed),files={};
  files['trips.json']={content:serialize(skip),contentType:'application/json'};
  batch.forEach(function(f){files[f]=pending.get(f)});gone.forEach(function(f){files[f]=null});
  api.publish(files).then(function(){
    batch.forEach(function(f){pending.delete(f);stored.add(f)});gone.forEach(function(f){removed.delete(f);stored.delete(f)});
    saving=false;if(pending.size||again)save();else setStatus('','Saqlandi');
  }).catch(function(err){
    saving=false;var c=err&&err.code;
    if(c==='conflict')setStatus('warn','Yangi versiya yuklanmoqda…');
    else if(c==='not_writer'||c==='not_granted'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'||c==='consent_required'){readOnly=true;
      setStatus('bad','Bu ko‘rinishda saqlab bo‘lmaydi. Havola ommaviy ochilgan bo‘lsa, uni vaqtincha yopib qayta urinib ko‘ring.');}
    else if(c==='too_large')setStatus('retry','Rasmlar juda katta. Kamroq rasm bilan urinib ko‘ring.');
    else if(c==='rate_limited'){setStatus('warn','Biroz kuting, keyin o‘zi saqlanadi…');saveTimer=setTimeout(save,9000);}
    else setStatus('retry','Saqlanmadi.');
  });
}
$('#retry').onclick=save;
function loadImg(src){return new Promise(function(ok,no){var im=new Image();im.onload=function(){ok(im)};im.onerror=no;im.src=src;});}
function shrink(file){
  var u=URL.createObjectURL(file);
  return loadImg(u).then(function(im){
    var s=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*s),hh=Math.round(im.naturalHeight*s);
    var c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(im,0,0,w,hh);
    return new Promise(function(ok,no){c.toBlob(function(b){b?ok({blob:b,w:w,h:hh}):no(new Error('blob'))},'image/jpeg',.82)});
  }).then(function(r){URL.revokeObjectURL(u);return r},function(e){URL.revokeObjectURL(u);throw e});
}
function addFiles(p,fl){
  var arr=Array.from(fl||[]).filter(function(f){return /^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name)});
  if(!arr.length)return;var done=0,bad=0;busy++;
  (function next(){
    if(!arr.length){busy--;renderSide();if(bad)toast(bad+' ta rasm ochilmadi. JPG yoki PNG shaklida qo‘shib ko‘ring.');dirty();return;}
    setStatus('', (done+1)+' / '+(done+arr.length)+' rasm tayyorlanmoqda…');
    var file=arr.shift();
    shrink(file).then(function(r){
      var f='photos/'+p.id.toLowerCase().replace(/\W/g,'')+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+'.jpg';
      pending.set(f,r.blob);urls.set(f,URL.createObjectURL(r.blob));p.photos.push({f:f,c:'',w:r.w,h:r.h});done++;
      if(sel===p.id)renderPanel();syncCovers();
    },function(){bad++;done++}).then(next);
  })();
}

  if(on){showDemo=false;if(sel&&!isVisited(sel)){closePanel();}$('#f-title').value=data.title||DEF_TITLE;$('#f-sub').value=data.subtitle||DEF_SUB;}
  else{showDemo=data.places.length===0&&!!demoPlaces;if(sel&&!isVisited(sel))closePanel();if(pending.size||removed.size)save();}
  renderSide();renderPanel();measure();
}

  var q=norm(e.target.value),box=$('#results');box.textContent='';
  if(!q){box.hidden=true;return;}
  if(!allPlaces)allPlaces=Object.keys(INDEX).map(function(k){return INDEX[k]}).sort(function(a,b){return a.name.localeCompare(b.name)});
  var m=allPlaces.filter(function(i){return norm(i.name).indexOf(q)>=0||norm(i.en).indexOf(q)>=0||i.id.toLowerCase()===q}).slice(0,8);
  m.forEach(function(i){box.append(h('button',{type:'button',onclick:function(){box.hidden=true;e.target.value='';addCountry(i.id)}},i.name,h('small',{text:isVisited(i.id)?'ro‘yxatda':''})))});
  if(!m.length)box.append(h('button',{type:'button',disabled:true,text:'Topilmadi'}));
  box.hidden=false;
});
document.addEventListener('click',function(e){if(!e.target.closest('.search')&&!e.target.closest('#addc'))$('#results').hidden=true});

/* ---------- saving straight to the GitHub repository (owner only, with a personal token) ---------- */
var GH={owner:'muhammadullomahmudov',repo:'travels',branch:'main'},TOKEN_KEY='travels_gh_token';
(function(){var m=location.hostname.match(/^([\w-]+)\.github\.io$/i);if(m){GH.owner=m[1];var seg=location.pathname.split('/').filter(Boolean)[0];if(seg&&!/\.html?$/.test(seg))GH.repo=seg;}})();
function ghToken(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}}
function ghReq(method,url,body,tok){
  return fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+url,{method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined})
  .then(function(r){if(!r.ok){var e=new Error('gh '+r.status);e.status=r.status;throw e;}return r.status===204?null:r.json();});
}
function b64blob(b){return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){ok(String(fr.result).split(',')[1])};fr.onerror=no;fr.readAsDataURL(b);});}
function b64text(s){return btoa(unescape(encodeURIComponent(s)));}
function ghApi(tok){return {publish:function(files){
  var ref,base;
  return ghReq('GET','/git/ref/heads/'+GH.branch,null,tok).then(function(r){ref=r.object.sha;return ghReq('GET','/git/commits/'+ref,null,tok);}).then(function(c){base=c.tree.sha;
    return Object.keys(files).reduce(function(pr,pth){return pr.then(function(acc){var v=files[pth];
      if(v===null){acc.push({path:pth,mode:'100644',type:'blob',sha:null});return acc;}
      return (v instanceof Blob?b64blob(v):Promise.resolve(b64text(v.content))).then(function(c64){return ghReq('POST','/git/blobs',{content:c64,encoding:'base64'},tok);})
        .then(function(bl){acc.push({path:pth,mode:'100644',type:'blob',sha:bl.sha});return acc;});});},Promise.resolve([]));
  }).then(function(tree){return ghReq('POST','/git/trees',{base_tree:base,tree:tree},tok);})
    .then(function(t){return ghReq('POST','/git/commits',{message:'Saytdan yangilandi: davlatlar va rasmlar',tree:t.sha,parents:[ref]},tok);})
    .then(function(c){return ghReq('PATCH','/git/refs/heads/'+GH.branch,{sha:c.sha},tok);})
    .catch(function(e){var x=new Error('save'),s=e&&e.status;x.code=s===401||s===403||s===404?'not_writer':s===409||s===422||s===429?'rate_limited':s===413?'too_large':'other';throw x;});
}};}
function askToken(onDone){
  var box=h('div',{class:'gh-modal',role:'dialog','aria-modal':'true','aria-label':'Saqlash uchun kirish'});
  var inp=h('input',{class:'inp',type:'password',id:'f-token',placeholder:'github_pat_…',autocomplete:'off'}),msg=h('p',{class:'gh-msg'});
  function close(){box.remove();document.removeEventListener('keydown',esc);}
  function esc(e){if(e.key==='Escape')close();}
  function go(){var t=inp.value.trim();if(!t)return;msg.textContent='Tekshirilmoqda…';
    ghReq('GET','',null,t).then(function(r){if(!r||!r.permissions||!r.permissions.push){var e=new Error('ro');e.status=403;throw e;}
      try{localStorage.setItem(TOKEN_KEY,t)}catch(_){}api=ghApi(t);readOnly=false;close();if(onDone)onDone();})
    .catch(function(e){msg.textContent=e&&e.status===401?'Token noto‘g‘ri yoki muddati o‘tgan.':'Bu token bilan '+GH.owner+'/'+GH.repo+' ga yozib bo‘lmaydi.';});}
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go();});
  box.addEventListener('click',function(e){if(e.target===box)close();});
  box.append(h('div',{class:'gh-card'},
    h('h3',{text:'Saqlash uchun kirish'}),
    h('p',{text:'Qo‘shilganlar saytga saqlanishi uchun GitHub tokeningizni bir marta kiriting. U faqat shu brauzerda saqlanadi, shuning uchun boshqalar hech narsa qo‘sha olmaydi.'}),
    h('ol',null,h('li',{text:'github.com → Settings → Developer settings → Fine-grained tokens → Generate new token'}),
      h('li',{text:'Repository access: faqat “'+GH.repo+'”. Permissions → Contents: Read and write'}),h('li',{text:'Hosil bo‘lgan tokenni shu yerga qo‘ying'})),
    h('div',{class:'field'},h('label',{for:'f-token',text:'GitHub token'}),inp),msg,
    h('div',{class:'row'},h('button',{class:'btn gold',text:'Davom etish',onclick:go}),h('button',{class:'btn',text:'Bekor qilish',onclick:close}))));
  document.body.append(box);document.addEventListener('keydown',esc);inp.focus();
}

/* ---------- boot ---------- */
function startWorld(){
  if(!window.d3)return false;
  var topo=window.Datamap&&window.Datamap.prototype&&window.Datamap.prototype.worldTopo;
  if(topo&&topo.arcs&&!feats.length){try{decodeWorld(topo)}catch(e){feats=[];}}
  return feats.length>0&&!!(map||initMap());
}
function begin(){
  buildDemo();showDemo=data.places.length===0&&!editing;
  renderSide();if(sel)renderPanel();else setTimeout(function(){fitWorld(false)},60);
}
function loadScript(src){return new Promise(function(ok){var s=document.createElement('script');s.src=src;s.onload=function(){ok(true)};s.onerror=function(){ok(false)};document.head.append(s);});}
window.addEventListener('resize',resize);
var worldReady=Promise.resolve(startWorld()).then(function(ok){
  if(ok||!window.d3)return ok;
  return loadScript('https://cdn.jsdelivr.net/npm/datamaps@0.5.9/dist/datamaps.world.min.js').then(startWorld);
});
var dataReady=fetch('trips.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(j&&Array.isArray(j.places)){data.title=j.title||'';data.subtitle=j.subtitle||'';if(j.home&&isFinite(j.home.lat)&&isFinite(j.home.lon))data.home=j.home;
    data.places=j.places.filter(function(p){return p&&p.id}).map(function(p){return {id:String(p.id),year:p.year||'',note:p.note||'',photos:(p.photos||[]).filter(function(x){return x&&x.f}).map(function(x){stored.add(x.f);return {f:x.f,c:x.c||'',w:x.w,h:x.h}})}});}
}).catch(function(){});
Promise.all([worldReady,dataReady]).then(function(r){
  if(!r[0])toast(window.d3?'Xarita yuklanmadi. Sahifani yangilab ko‘ring.':'Xarita yuklanmadi. Internetni tekshirib, sahifani yangilang.');
  if(window.d3)begin();else{$('#sub').textContent=DEF_SUB;}
});
$('#sub').textContent=DEF_SUB;
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){});
var use=window.claude&&window.claude.use;
if(use)Promise.resolve(window.claude.use('artifact')).then(function(a){
  if(!a||typeof a.publish!=='function')return;api=a;if(showDemo)renderSide();
}).catch(function(){});
if(!api&&ghToken())api=ghApi(ghToken());

})();
